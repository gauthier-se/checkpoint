spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IGDB API Configuration (via Twitch OAuth2)
igdb.api.client-id=${IGDB_CLIENT_ID:}
igdb.api.client-secret=${IGDB_CLIENT_SECRET:}
igdb.api.base-url=https://api.igdb.com/v4
igdb.api.auth-url=https://id.twitch.tv/oauth2/token

# Steam Web API + OpenID 2.0
steam.api.key=${STEAM_API_KEY:}
steam.api.base-url=https://api.steampowered.com
steam.openid.provider-url=https://steamcommunity.com/openid/login
# Realm and return URL used in the OpenID 2.0 redirect. Steam redirects the user
# back to the return URL, which points at this API directly in production: the
# auth cookie still reaches us because COOKIE_DOMAIN scopes it to the parent
# domain shared by the API and the web app. Locally there is no shared parent, so
# the return URL goes through the web origin and the Nitro proxy forwards it.
steam.openid.realm=${STEAM_OPENID_REALM:http://localhost:3000}
steam.openid.return-url=${STEAM_OPENID_RETURN_URL:http://localhost:3000/api/v1/auth/steam/openid/callback}
# TTL of the Steam signup token issued when an unlinked user completes Steam OpenID
# and is bounced to /register with prefill. Short: the user is expected to finish
# the signup in the same browser session.
steam.signup.token-ttl-ms=${STEAM_SIGNUP_TOKEN_TTL_MS:600000}

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IGRvIG5vdCB1c2UgaW4gcHJvZHVjdGlvbg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail Configuration (MailHog for local development)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Hibernate Search (Lucene)
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=data/search-index

# Frontend URL: used by the OAuth2 success/failure handlers to redirect the browser back
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Cookie security: set to false in local dev (HTTP), true in production (HTTPS)
app.cookie.secure=${COOKIE_SECURE:true}
# Set cookie domain for cross-subdomain sharing (e.g. .seyzeriat.com in production)
app.cookie.domain=${COOKIE_DOMAIN:}

# API documentation (SpringDoc / Swagger UI)
# Enabled by default for local development; set SWAGGER_ENABLED=false in production
# to hide /swagger-ui.html and /v3/api-docs.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# OAuth2 client credentials.
# OAuth2 login is wired programmatically (see OAuth2ClientRegistrationConfig)
# only when both id and secret are non-empty for at least one provider.
oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth2.twitch.client-id=${TWITCH_CLIENT_ID:}
oauth2.twitch.client-secret=${TWITCH_CLIENT_SECRET:}

# News auto-import: RSS feeds (see NewsImportTask)
news.rss.feeds[0].name=IGN
news.rss.feeds[0].url=https://feeds.feedburner.com/ign/all
news.rss.feeds[1].name=Eurogamer
news.rss.feeds[1].url=https://www.eurogamer.net/?format=rss
news.rss.feeds[2].name=Rock Paper Shotgun
news.rss.feeds[2].url=https://www.rockpapershotgun.com/feed

# Trust X-Forwarded-* headers from the reverse proxy (generates https:// callback URLs)
server.forward-headers-strategy=framework

# Actuator: exposes health plus the build timestamp, which the CD workflow polls
# to confirm a deployment actually replaced the running container instead of
# trusting the deploy hook's acknowledgement. The base path sits under /api/v1
# because the web app's Nitro proxy only forwards /api/** to this service, so
# anything outside that prefix is unreachable from the internet.
management.endpoints.web.base-path=/api/v1/actuator
management.endpoints.web.exposure.include=health,info
# Both endpoints are public (see SecurityConfig), so they must stay terse: no
# component breakdown, no environment or Java details.
management.endpoint.health.show-details=never
# spring-boot-starter-mail contributes a health indicator that opens an SMTP
# connection. An unreachable relay would drag the whole endpoint to DOWN and make
# a perfectly serving deployment look dead, so it is left out: mail delivery
# failures surface in the logs, not in the deploy probe.
management.health.mail.enabled=false
management.info.build.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
