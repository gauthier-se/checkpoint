# Dependabot keeps the dependency alerts from piling up: security updates are
# raised as soon as an advisory lands, and the weekly version updates keep us
# close enough to the patched releases that the security bumps stay small.
#
# Version updates are grouped per module so a quiet week is one PR, not ten.
# Security updates ignore the groups and always get their own PR.
#
# Every module in the tree is covered. The two that used to be excluded,
# `desktop/` and `doc/presentation/`, have been archived out of the repository
# (see ARCHIVE.md).
version: 2

updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - api
    commit-message:
      prefix: chore(api)
    groups:
      api-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - web
    commit-message:
      prefix: chore(web)
      # "chore(web): bump x" for prod deps, "chore(web)(deps-dev): bump x" for
      # dev ones — the scope stays parseable either way.
      include: scope
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - github
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"

# Nothing is deliberately excluded any more. `desktop/` and `doc/presentation/`
# were the two uncovered modules and both were archived on 2026-08-18; they are
# recoverable from the `desktop-final` and `presentation-final` tags. See
# ARCHIVE.md.
