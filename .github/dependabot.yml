# Dependabot keeps the dependency alerts from piling up: security updates are
# raised as soon as an advisory lands, and the weekly version updates keep us
# close enough to the patched releases that the security bumps stay small.
#
# Version updates are grouped per module so a quiet week is one PR, not ten.
# Security updates ignore the groups and always get their own PR.
#
# Every module in the tree is covered. The two that used to be excluded,
# `desktop/` and `doc/presentation/`, have been archived out of the repository
# (see ARCHIVE.md).
version: 2

updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - api
    commit-message:
      prefix: chore(api)
    groups:
      api-minor-and-patch:
        update-types:
          - minor
          - patch
    # These three majors are all gated on the same thing: a Spring Boot 4
    # upgrade. Boot 3.5.7 manages hibernate-core 6.6.x, while
    # hibernate-search-mapper-orm 8.x depends on hibernate-core 7.4 and does not
    # compile against 6.6 (the predicate DSL factories gained a type parameter).
    # springdoc 3.x pulls spring-boot-tomcat and spring-boot-health, artifacts
    # that only exist in Boot 4. Until the API moves to Boot 4, Dependabot would
    # re-raise all three every week and all three would fail CI. Drop these
    # entries as part of that upgrade.
    ignore:
      - dependency-name: org.springdoc:springdoc-openapi-starter-webmvc-ui
        update-types:
          - version-update:semver-major
      - dependency-name: org.hibernate.search:hibernate-search-mapper-orm
        update-types:
          - version-update:semver-major
      - dependency-name: org.hibernate.search:hibernate-search-backend-lucene
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - web
    commit-message:
      prefix: chore(web)
      # "chore(web): bump x" for prod deps, "chore(web)(deps-dev): bump x" for
      # dev ones — the scope stays parseable either way.
      include: scope
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
    # @vitejs/plugin-react 6 peer-requires vite ^8 and imports "vite/internal",
    # a subpath vite 7 does not export, so the test run dies at startup with
    # ERR_PACKAGE_PATH_NOT_EXPORTED. Bumping it means moving the app to vite 8
    # first. Drop this entry once that happens.
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - github
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"

# Every module in the tree is covered. `desktop/` and `doc/presentation/` used
# to be the two uncovered ones; both were archived on 2026-08-18 and are
# recoverable from the `desktop-final` and `presentation-final` tags (ARCHIVE.md).
#
# The only exclusions left are the four `ignore` entries above, each pinned to
# majors that cannot build against the current stack. They are temporary and
# each one names the upgrade that lifts it.
