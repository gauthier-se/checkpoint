name: CD

# Dokploy's own "auto deploy on push" is off on both applications: it deploys
# without passing this gate, and it fails silently when its watch paths or branch
# do not match. Deployments go through the application.deploy API rather than an
# application's deploy hook, which is a git-provider webhook receiver and refuses
# with 400 when autoDeploy is off.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which application to redeploy"
        type: choice
        options: [both, api, web]
        default: both

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://checkpoint.seyzeriat.com
  # Each application has its own domain, and the browser bundle calls the API
  # directly. SITE_URL/api/** is a dev-only Nitro route rule and never resolves
  # in production.
  API_URL: https://checkpoint-api.seyzeriat.com

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to deploy
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              api) api=true;  web=false ;;
              web) api=false; web=true  ;;
              *)   api=true;  web=true  ;;
            esac
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Diff base gone (first push, or history rewritten): deploy both
            # rather than silently skipping one.
            echo "No usable diff base ($BEFORE), deploying both applications."
            api=true
            web=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"
            echo "$changed" | awk '{ print "  " $0 }'
            if echo "$changed" | grep -q '^api/'; then api=true; else api=false; fi
            if echo "$changed" | grep -q '^web/'; then web=true; else web=false; fi
          fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Deploy API: $api, deploy web: $web"

  test-api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api-ci.yml
    secrets: inherit

  test-web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-ci.yml
    secrets: inherit

  deploy-api:
    name: Deploy API
    needs: [changes, test-api]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the trigger time
        id: start
        # Two minutes of slack absorbs clock skew against the VPS.
        run: echo "at=$(( $(date -u +%s) - 120 ))" >> "$GITHUB_OUTPUT"

      - name: Trigger the Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$APPLICATION_ID" ]; then
            echo "::error::DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_API_APPLICATION_ID must all be set in the repository secrets."
            exit 1
          fi

          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$APPLICATION_ID" '{ applicationId: $id }')")

          echo "Dokploy answered HTTP $status: $(cat "$body")"
          case "$status" in
            2*) ;;
            *) echo "::error::Dokploy refused the deploy request (HTTP $status)."; exit 1 ;;
          esac

      - name: Wait for the new build to serve traffic
        env:
          STARTED_AT: ${{ steps.start.outputs.at }}
        # Dokploy only queues the deployment, so the rollout has to be observed.
        # The gate is the JVM start instant, not build.time: image layers are
        # cached on the source tree, so a deploy leaving api/ untouched rebuilds
        # to an identical image whose build.time never moves.
        run: |
          set -uo pipefail
          info_url="$API_URL/api/v1/actuator/info"
          deadline=$(( $(date -u +%s) + 900 ))
          attempt=0
          last_state=""

          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            body=$(curl -sS --max-time 15 "$info_url" 2>/dev/null || true)
            started=$(printf '%s' "$body" | jq -r '.process.start // empty' 2>/dev/null || true)
            build_time=$(printf '%s' "$body" | jq -r '.build.time // empty' 2>/dev/null || true)

            if [ -n "$started" ]; then
              started_at=$(date -u -d "$started" +%s 2>/dev/null || echo 0)
              if [ "$started_at" -ge "$STARTED_AT" ]; then
                echo "API is live: process started at $started, image built at ${build_time:-unknown}."
                exit 0
              fi
              state="still running the process started at $started"
            else
              state="not answering"
            fi

            if [ "$state" != "$last_state" ] || [ $(( attempt % 8 )) -eq 0 ]; then
              echo "API $state, waiting."
              last_state="$state"
            fi

            attempt=$(( attempt + 1 ))
            sleep 15
          done

          echo "::error::The API never reported a process started after this run, so the rollout was never applied. A task Swarm rejects outright, over an invalid mount for instance, produces neither a container nor a log line: 'docker service ps --no-trunc <service>' is what shows that."
          exit 1

  deploy-web:
    name: Deploy web
    # After deploy-api: the web app calls endpoints that must already exist.
    needs: [changes, test-web, deploy-api]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Note the currently served bundle
        id: before
        run: |
          set -uo pipefail
          hash=$(curl -sS --max-time 20 "$SITE_URL/" 2>/dev/null \
            | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Currently served bundle: ${hash:-unknown}"

      - name: Trigger the Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$APPLICATION_ID" ]; then
            echo "::error::DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_WEB_APPLICATION_ID must all be set in the repository secrets."
            exit 1
          fi

          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$APPLICATION_ID" '{ applicationId: $id }')")

          echo "Dokploy answered HTTP $status: $(cat "$body")"
          case "$status" in
            2*) ;;
            *) echo "::error::Dokploy refused the deploy request (HTTP $status)."; exit 1 ;;
          esac

      - name: Wait for the site to serve traffic again
        env:
          BEFORE_HASH: ${{ steps.before.outputs.hash }}
        # The web app has no build stamp, so this only proves it is back up. The
        # bundle hash is content-derived and reported, not enforced: a deploy
        # touching only the lockfile can rebuild to the same bundle.
        run: |
          set -uo pipefail
          deadline=$(( $(date -u +%s) + 900 ))
          settled_since=""

          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            html=$(curl -sS --max-time 15 "$SITE_URL/" 2>/dev/null || true)
            if printf '%s' "$html" | grep -q '<!DOCTYPE html>'; then
              # Settle before reading the hash, so the outgoing container is not
              # the one measured.
              if [ -z "$settled_since" ]; then
                settled_since=$(date -u +%s)
              elif [ $(( $(date -u +%s) - settled_since )) -ge 30 ]; then
                hash=$(printf '%s' "$html" \
                  | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
                echo "Web is live, serving ${hash:-unknown}."
                if [ -n "$BEFORE_HASH" ] && [ "$hash" = "$BEFORE_HASH" ]; then
                  echo "::warning::The bundle hash did not change. If this commit touched application code, the web container may still be on the previous image."
                fi
                exit 0
              fi
            else
              settled_since=""
              echo "Site not answering yet, waiting."
            fi
            sleep 15
          done

          echo "::error::The site never came back up. Check the web application's build logs in Dokploy."
          exit 1
